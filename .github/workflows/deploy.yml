name: Deploy to EC2

on:
  push:
    branches: [main]

env:
  ECR_REPOSITORY: booktalk-backend

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.build.outputs.image }}
      registry: ${{ steps.ecr-login.outputs.registry }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      # 메모리가 작은 EC2(t3.micro 등)에서 직접 빌드하면 OOM 위험이 있어
      # 빌드는 여기(GitHub Actions 러너)에서 하고, EC2는 완성된 이미지만 pull한다.
      - name: Build, tag, and push image
        id: build
        env:
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:latest \
            .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest
          echo "image=$ECR_REGISTRY/$ECR_REPOSITORY:latest" >> "$GITHUB_OUTPUT"

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_SSH_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          # EC2 인스턴스에 ECR pull 권한이 있는 IAM 역할이 붙어있어야
          # 별도 AWS 자격증명 저장 없이 aws ecr get-login-password가 동작한다.
          script: |
            cd ~/booktalk-backend
            git pull origin main
            aws ecr get-login-password --region ${{ secrets.AWS_REGION }} \
              | docker login --username AWS --password-stdin ${{ needs.build-and-push.outputs.registry }}
            export ECR_REPOSITORY_URI="${{ needs.build-and-push.outputs.image }}"
            docker compose pull app
            docker compose up -d
            docker image prune -f
