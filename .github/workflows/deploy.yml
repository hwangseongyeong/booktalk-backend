name: Deploy to EC2

on:
  push:
    branches: [main]

env:
  ECR_REPOSITORY: booktalk-backend

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      # 메모리가 작은 EC2(t3.micro 등)에서 직접 빌드하면 OOM 위험이 있어
      # 빌드는 여기(GitHub Actions 러너)에서 하고, EC2는 완성된 이미지만 pull한다.
      - name: Build, tag, and push image
        id: build
        env:
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:latest \
            .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_SSH_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          # EC2 인스턴스에 ECR pull 권한이 있는 IAM 역할이 붙어있어야
          # 별도 AWS 자격증명 저장 없이 aws ecr get-login-password가 동작한다.
          #
          # ECR 주소(계정 ID 포함)를 build 잡의 output으로 넘기면 GitHub가
          # secret으로 마스킹해 빈 값이 되고, 그러면 compose가 로컬 빌드로 폴백해
          # EC2에서 느린 빌드가 돌아버린다. 그래서 EC2에서 IAM 역할로 계정 ID를
          # 직접 조회해 ECR 주소를 재구성한다.
          script: |
            set -e
            cd ~/booktalk-backend
            git pull origin main
            REGION=${{ secrets.AWS_REGION }}
            ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
            REGISTRY="${ACCOUNT_ID}.dkr.ecr.${REGION}.amazonaws.com"
            aws ecr get-login-password --region "$REGION" \
              | docker login --username AWS --password-stdin "$REGISTRY"
            export ECR_REPOSITORY_URI="${REGISTRY}/${{ env.ECR_REPOSITORY }}:latest"
            docker compose pull app
            docker compose up -d
            docker image prune -f
