spring:
  application:
    name: booktalk-backend
  profiles:
    active: local
  servlet:
    multipart:
      max-file-size: 10MB      # 이미지 업로드 상한(UploadService의 MAX_BYTES와 일치)
      max-request-size: 12MB
  datasource:
    # DB 커넥션 풀(HikariCP). 고동접 시 기본값(10)은 금방 고갈되므로 명시적으로 넉넉히 잡는다.
    # 인스턴스당 20 기준(수평 확장). DB max_connections와의 총합을 넘지 않게 운영에서 조정.
    hikari:
      maximum-pool-size: ${DB_POOL_MAX:20}
      minimum-idle: ${DB_POOL_MIN:5}
      connection-timeout: 10000   # 풀 소진 시 10초 대기 후 빠르게 실패(스레드 장기 블로킹 방지)
      max-lifetime: 1700000       # DB wait_timeout 보다 짧게
      keepalive-time: 300000
  jpa:
    hibernate:
      ddl-auto: validate # 스키마 변경은 Flyway로만 관리
    open-in-view: false
    properties:
      hibernate:
        format_sql: false              # 운영 로깅 비용 제거
        default_batch_fetch_size: 100  # LAZY 연관을 IN(...)으로 묶어 N+1 완화(코드 변경 없이)
        order_inserts: true
        order_updates: true
        jdbc:
          batch_size: 30
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:8080}
  tomcat:
    threads:
      max: ${TOMCAT_THREADS_MAX:50}   # 커넥션 풀(20)과 균형. 200개가 20개를 두고 경합하는 비대칭 방지
      min-spare: 10
    accept-count: 100

springdoc:
  swagger-ui:
    path: /swagger-ui.html

# 이미지 저장소 설정. storage=local(기본)이면 로컬 디스크, s3이면 AWS S3를 사용한다.
# 서빙 경로(GET /api/v1/uploads/images/{파일명})는 두 경우 모두 동일하다.
app:
  upload:
    storage: ${UPLOAD_STORAGE:local}   # local | s3
    dir: ${UPLOAD_DIR:uploads}         # local 모드일 때 저장 경로
  s3:
    bucket: ${AWS_S3_BUCKET:}
    region: ${AWS_S3_REGION:ap-northeast-2}
    # 운영에서는 IAM 역할 권장(키 비워두면 기본 자격증명 체인 사용).
    # 로컬 개발에서만 application-local.yml 또는 환경변수로 키 주입.
    access-key: ${AWS_ACCESS_KEY_ID:}
    secret-key: ${AWS_SECRET_ACCESS_KEY:}

---
spring:
  config:
    activate:
      on-profile: local
  # 실제 DB 접속 정보는 application-local.yml (git-ignored)에 오버라이드해서 작성
