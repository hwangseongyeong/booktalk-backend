spring:
  application:
    name: booktalk-backend
  profiles:
    active: local
  jpa:
    hibernate:
      ddl-auto: validate # 스키마 변경은 Flyway로만 관리
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080

springdoc:
  swagger-ui:
    path: /swagger-ui.html

---
spring:
  config:
    activate:
      on-profile: local
  # 실제 DB 접속 정보는 application-local.yml (git-ignored)에 오버라이드해서 작성
